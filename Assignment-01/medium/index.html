<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
</head>

<body>
    <section>
        <nav>
            <div class="menu"><i class="ri-menu-fill"></i></div>
            <div class="logo"><img src="" alt=""></div>
            <div class="mode"><i class="ri-sun-line"></i></div>
        </nav>
        <main>
            <section class="search-section">
                <div class="search">
                    <i class="ri-search-line"></i>
                    <input type="text" placeholder="Search for a pokemon">
                </div>
                <div class="filter">
                    <p>Filter by typer(1)</p>
                    <i class="ri-filter-3-line"></i>
                </div>
            </section>
            <section class="main-cards">
                <div class="card">
                    <img src="image/167dd980-8fcf-4145-9f95-3d0cdcb743a1.png" alt="Meowscarada" width="100px"
                        height="200px">
                    <h3>Meowscarada</h3>
                    <div class="type grass">Grass</div>
                </div>

                <div class="card">
                    <img src="image/poke_capture_0624_000_mf_n_00000000_f_r.jpg" alt="Pawniard">
                    <h3>Pawniard</h3>
                    <div class="type dark">Dark / Steel</div>
                </div>

                <div class="card">
                    <img src="image/Screenshot 2026-06-05 102047.png" alt="Houndoom" width="100px" height="200px">
                    <h3>Houndoom</h3>
                    <div class="type fire">Dark / Fire</div>
                </div>

                <div class="card">
                    <img src="image/Screenshot 2026-06-05 102629.png" alt="Inkay">
                    <h3>Inkay</h3>
                    <div class="type water">Dark / Psychic</div>
                </div>
            </section>
            <section>
                <div class="feature-container">

                    <div class="feature-item">
                        <div class="icon blue">
                            <i class="fa-solid fa-compass"></i>
                        </div>
                        <div class="content">
                            <h3>Explore</h3>
                            <p>Discover all your favorite Pokémon</p>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="feature-item">
                        <div class="icon green">
                            <i class="fa-solid fa-leaf"></i>
                        </div>
                        <div class="content">
                            <h3>Filter</h3>
                            <p>Find Pokémon by types and abilities</p>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="feature-item">
                        <div class="icon yellow">
                            <i class="fa-solid fa-star"></i>
                        </div>
                        <div class="content">
                            <h3>Collection</h3>
                            <p>Save and manage your collection</p>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="feature-item">
                        <div class="icon purple">
                            <i class="fa-solid fa-chart-simple"></i>
                        </div>
                        <div class="content">
                            <h3>Stats</h3>
                            <p>View stats and learn about Pokémon</p>
                        </div>
                    </div>

                </div>
            </section>
        </main>
    </section>


</body>

</html>
